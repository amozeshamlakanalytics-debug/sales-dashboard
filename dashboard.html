<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد مدیریتی فروش</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Vazirmatn', sans-serif;
    background: #07080a;
    color: #fff;
    direction: rtl;
    overflow-x: hidden;
  }
  body {
    padding: 1.8rem 2.6rem 2.2rem;
    min-height: 100vh;
    background:
      radial-gradient(circle at 10% 0%, rgba(191,151,87,0.10), transparent 40%),
      radial-gradient(circle at 95% 100%, rgba(191,151,87,0.07), transparent 40%),
      linear-gradient(180deg, #0a0b0d 0%, #07080a 100%);
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }
  .stage { position: relative; z-index: 1; }

  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes countGlow { 0%,100% { text-shadow: 0 0 18px rgba(191,151,87,0.0); } 50% { text-shadow: 0 0 18px rgba(191,151,87,0.35); } }
  @keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes crownFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* ===== TOP BAR ===== */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; flex-wrap: wrap; gap: 12px; animation: fadeUp .5s ease; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand-mark { height: 50px; display: flex; align-items: center; flex-shrink: 0; }
  .brand-mark img { height: 100%; width: auto; object-fit: contain; filter: drop-shadow(0 4px 14px rgba(191,151,87,0.25)); }
  .brand-text h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.3px; background: linear-gradient(90deg, #fff 0%, #e8d5b0 50%, #fff 100%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 6s linear infinite; }
  .brand-text p { font-size: 13px; color: #888; margin-top: 3px; }
  .top-right { display: flex; align-items: center; gap: 14px; }
  .clock-box { text-align: left; }
  .clock-time { font-size: 19px; font-weight: 700; color: #e8d5b0; font-variant-numeric: tabular-nums; }
  .clock-date { font-size: 12px; color: #777; margin-top: 1px; }
  .live-pill { display: flex; align-items: center; gap: 8px; background: #131418; border: 1px solid #262626; border-radius: 30px; padding: 8px 18px; font-size: 13px; color: #aaa; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ecf6e; box-shadow: 0 0 10px #3ecf6e; animation: pulse 1.6s ease-in-out infinite; }

  /* ===== KPI ROW ===== */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 1.5rem; }
  .kpi-card {
    background: linear-gradient(160deg, #14151a 0%, #0f1012 100%);
    border: 1px solid #232323;
    border-radius: 18px;
    padding: 1.25rem 1.4rem;
    position: relative;
    overflow: hidden;
    animation: fadeUp .6s ease backwards;
  }
  .kpi-card:nth-child(1) { animation-delay: .05s; }
  .kpi-card:nth-child(2) { animation-delay: .1s; }
  .kpi-card:nth-child(3) { animation-delay: .15s; }
  .kpi-card:nth-child(4) { animation-delay: .2s; }
  .kpi-card::before { content: ''; position: absolute; top: -20%; right: -20%; width: 140px; height: 140px; background: radial-gradient(circle, rgba(191,151,87,0.18), transparent 70%); border-radius: 50%; }
  .kpi-card::after { content: ''; position: absolute; bottom: 0; right: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, #BF9757, transparent); opacity: .6; }
  .kpi-label { font-size: 13px; color: #8a8a8a; margin-bottom: 6px; font-weight: 500; }
  .kpi-value { font-size: 31px; font-weight: 700; color: #fff; white-space: nowrap; position: relative; z-index: 1; animation: countGlow 3s ease-in-out infinite; }
  .kpi-value .unit { font-size: 14px; color: #999; font-weight: 500; margin-right: 5px; }
  .kpi-bar { height: 4px; background: #1d1e22; border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .kpi-bar-fill { height: 100%; background: linear-gradient(90deg, #8a6d3e, #BF9757); border-radius: 4px; transition: width 1s ease; }

  /* ===== TEAM STRIP ===== */
  .team-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 1.6rem; }
  .team-card {
    background: linear-gradient(160deg, #131418 0%, #0e0f11 100%);
    border: 1px solid #222226;
    border-radius: 18px;
    padding: 1rem .8rem 1.1rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: fadeUp .6s ease backwards;
    transition: border-color .3s, transform .3s;
  }
  .team-card:nth-child(1) { animation-delay: .05s; }
  .team-card:nth-child(2) { animation-delay: .1s; }
  .team-card:nth-child(3) { animation-delay: .15s; }
  .team-card:nth-child(4) { animation-delay: .2s; }
  .team-card:nth-child(5) { animation-delay: .25s; }
  .team-card.leader { border-color: rgba(191,151,87,0.55); }
  .team-card.leader::before { content: ''; position: absolute; top: -30%; left: 50%; transform: translateX(-50%); width: 160px; height: 160px; background: radial-gradient(circle, rgba(191,151,87,0.22), transparent 70%); }
  .crown-icon { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 17px; animation: crownFloat 2s ease-in-out infinite; z-index: 2; }
  .avatar-ring { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 10px; position: relative; padding: 3px; background: conic-gradient(from 0deg, #BF9757, #e8d5b0, #BF9757); }
  .team-card:not(.leader) .avatar-ring { background: #2a2a2a; }
  .avatar-img-wrap { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #1a1a1c; border: 2px solid #0e0f11; }
  .avatar-img-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .team-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .team-role { font-size: 11px; color: #777; margin-bottom: 8px; }
  .team-daily { font-size: 17px; font-weight: 700; color: #e8d5b0; }
  .team-daily-label { font-size: 10px; color: #666; margin-top: 1px; }
  .team-rank-badge { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #1c1c1e; color: #888; }
  .team-rank-badge.gold { background: linear-gradient(135deg, #f4d27a, #BF9757); color: #2a1f0d; }
  .team-rank-badge.silver { background: #b9b9b9; color: #1a1a1a; }
  .team-rank-badge.bronze { background: #a36a3e; color: #1a1a1a; }

  /* ===== MAIN GRID ===== */
  .main-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } .team-strip { grid-template-columns: repeat(3,1fr); } }

  .panel {
    background: linear-gradient(160deg, #131418 0%, #0e0f11 100%);
    border: 1px solid #222226;
    border-radius: 20px;
    padding: 1.5rem;
    animation: fadeUp .6s ease .1s backwards;
  }
  .panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.1rem; }
  .panel-title h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .panel-title h2::before { content: ''; width: 6px; height: 16px; border-radius: 3px; background: #BF9757; display: inline-block; }
  .panel-title .tag { font-size: 11px; color: #BF9757; background: rgba(191,151,87,0.12); border: 1px solid rgba(191,151,87,0.4); border-radius: 20px; padding: 4px 13px; font-weight: 700; }

  .chart-wrap { position: relative; height: 270px; }
  .legend-row { display: flex; justify-content: center; gap: 30px; margin-top: 12px; font-size: 13px; color: #999; }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

  .sub-panel { margin-top: 18px; background: #0d0e10; border: 1px solid #1d1d1f; border-radius: 16px; padding: 1.2rem; }
  .sub-panel-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: #ddd; }

  .lb-row { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: .5px solid #1c1c1c; }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { width: 26px; height: 26px; border-radius: 9px; background: #1a1a1c; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #888; flex-shrink: 0; }
  .lb-rank.r1 { background: linear-gradient(135deg, #f4d27a, #BF9757); color: #2a1f0d; }
  .lb-rank.r2 { background: #b9b9b9; color: #1a1a1a; }
  .lb-rank.r3 { background: #a36a3e; color: #1a1a1a; }
  .lb-name { flex: 1; font-size: 14px; font-weight: 500; }
  .lb-bar-mini { width: 60px; height: 5px; background: #1d1d1f; border-radius: 4px; overflow: hidden; }
  .lb-bar-mini-fill { height: 100%; background: #BF9757; border-radius: 4px; }
  .lb-val { font-size: 13px; font-weight: 700; color: #e8d5b0; white-space: nowrap; min-width: 85px; text-align: left; }

  .timer-bar { height: 4px; background: #1d1d1f; border-radius: 3px; margin-bottom: 1.1rem; overflow: hidden; }
  .timer-fill { height: 100%; background: linear-gradient(90deg, #8a6d3e, #BF9757); width: 0%; transition: width linear; }
  .slide { display: none; }
  .slide.active { display: block; animation: fadeUp .45s ease; }
  .slide-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.1rem; flex-wrap: wrap; gap: 8px; }
  .slide-person { display: flex; align-items: center; gap: 12px; }
  .slide-avatar { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: #1a1a1c; border: 2px solid #BF9757; flex-shrink: 0; }
  .slide-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .slide-avatar.no-img { display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #BF9757; background: rgba(191,151,87,0.12); }
  .slide-name { font-size: 21px; font-weight: 700; }
  .slide-sub { font-size: 13px; color: #777; margin-top: 2px; }
  .badge { font-size: 12px; padding: 5px 14px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
  .badge-gold { background: linear-gradient(135deg, #e8d5b0, #BF9757); color: #2a1f0d; }
  .badge-total { background: rgba(191,151,87,0.12); border: 1px solid #BF9757; color: #BF9757; }
  .progress-overall { display: flex; align-items: center; gap: 10px; margin-bottom: 1.2rem; background: #0d0e10; border: 1px solid #1d1d1f; border-radius: 12px; padding: 10px 14px; }
  .progress-overall .label { font-size: 13px; color: #999; white-space: nowrap; }
  .progress-overall .track { flex: 1; height: 9px; background: #1d1d1f; border-radius: 8px; overflow: hidden; }
  .progress-overall .fillp { height: 100%; background: linear-gradient(90deg, #8a6d3e, #BF9757); border-radius: 8px; transition: width .6s ease; }
  .progress-overall .pct { font-size: 15px; font-weight: 700; color: #e8d5b0; min-width: 42px; text-align: left; }
  .rows { display: flex; flex-direction: column; gap: 9px; }
  .ri { display: flex; align-items: center; gap: 10px; }
  .rl { width: 125px; min-width: 95px; font-size: 13.5px; font-weight: 500; color: #ccc; text-align: right; flex-shrink: 0; }
  .bo { flex: 1; height: 24px; background: #16171a; border-radius: 24px; position: relative; overflow: hidden; border: .5px solid #262626; }
  .bi { height: 100%; border-radius: 24px; background: linear-gradient(90deg, #8a6d3e, #BF9757); transition: width .6s ease; }
  .bm { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12.5px; color: #fff; font-weight: 700; }
  .nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 1.2rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #2a2a2a; cursor: pointer; border: 1px solid #3a3a3a; transition: all .3s; }
  .dot.active { background: #BF9757; box-shadow: 0 0 8px rgba(191,151,87,0.6); transform: scale(1.3); }

  .loading, .err { text-align: center; padding: 3rem; color: #666; font-size: 16px; }
  .err { color: #e24b4a; }
</style>
</head>
<body>
<div class="stage">

<div class="topbar">
  <div class="brand">
    <div class="brand-mark"><img src="https://amozeshamlak.com/wp-content/uploads/2026/05/oe-w-name-01-1-e1777970042185.png" alt="لوگو" /></div>
    <div class="brand-text">
      <h1>داشبورد مدیریتی فروش</h1>
      <p>اتاق فرمان عملکرد تیم فروش</p>
    </div>
  </div>
  <div class="top-right">
    <div class="clock-box">
      <div class="clock-time" id="clockTime"></div>
      <div class="clock-date" id="clockDate"></div>
    </div>
    <div class="live-pill"><span class="live-dot"></span>زنده — متصل به Google Sheets</div>
  </div>
</div>

<div class="kpi-row" id="kpiRow">
  <div class="loading">در حال بارگذاری شاخص‌ها...</div>
</div>

<div class="team-strip" id="teamStrip"></div>

<div class="main-grid">
  <div class="panel">
    <div class="panel-title">
      <h2>فروش و قسط روزانه هر کارشناس</h2>
      <span class="tag">امروز</span>
    </div>
    <div class="chart-wrap">
      <canvas id="salesChart" role="img" aria-label="نمودار ستونی فروش و قسط امروز هر کارشناس فروش">نمودار فروش و قسط روزانه</canvas>
    </div>
    <div class="legend-row">
      <div class="legend-item"><span class="legend-dot" style="background:#FCD202;"></span>فروش</div>
      <div class="legend-item"><span class="legend-dot" style="background:#7d7d7d;"></span>قسط</div>
    </div>

    <div class="sub-panel">
      <div class="sub-panel-title">رتبه‌بندی فروش امروز</div>
      <div id="leaderboard"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <h2>گزارش تفصیلی محصولات</h2>
      <span class="tag">به ترتیب</span>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div id="slidesWrap"><div class="loading">در حال دریافت اطلاعات...</div></div>
    <div class="nav" id="navDots"></div>
  </div>
</div>

</div>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREbVqCizGPAJxn42P6HMEOWXwC8M7YZulA33gH9MplFbhbHxWn6UIxzxIn765HwvPhLBVJ-L6GO2Gb/pub?output=csv";
const SLIDE_INTERVAL = 15000;
const AUTO_REFRESH_MS = 10 * 1000;

const PHOTOS = {
  "شهرزاد دستجردی": "https://amozeshamlak.com/wp-content/uploads/2026/04/dastjerd-1-scaled.webp",
  "نازنین وزیری": "https://amozeshamlak.com/wp-content/uploads/2026/04/vazir.webp",
  "فاطمه پرسشی": "https://amozeshamlak.com/wp-content/uploads/2026/04/porsesh-scaled.webp",
  "زهرا آذر": "https://amozeshamlak.com/wp-content/uploads/2026/04/azar-scaled.webp",
  "زهرا حسین زاده": "https://amozeshamlak.com/wp-content/uploads/2026/05/IMG_20260426_125219-3.png"
};

let cur = 0, playing = true, timer = null, people = [];
let salesChartInstance = null;
const fill = document.getElementById('timerFill');

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const fullText = text.replace(/\r/g, '');
  let i = 0;
  while (i < fullText.length) {
    const c = fullText[i];
    if (inQuotes) {
      if (c === '"') {
        if (fullText[i+1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++; continue;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const filtered = rows.filter(r => r.some(c => c.trim() !== ''));
  const headers = filtered[0].map(h => h.trim());
  return filtered.slice(1).map(r => {
    const obj = {};
    headers.forEach((h,i) => obj[h] = (r[i] || '').trim());
    return obj;
  });
}
function parseNumber(str) {
  if (!str) return 0;
  const cleaned = String(str).replace(/[,\s]/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function formatNum(n) { return Number(n || 0).toLocaleString('en-US'); }
function initials(name) { return name.trim().split(' ')[0].charAt(0); }

function getDailyMap(rows) {
  const sales = {}, installment = {};
  rows.forEach(row => {
    const name = row['Foroosh'];
    if (!name) return;
    sales[name] = parseNumber(row['valueF']);
    installment[name] = parseNumber(row['ValueG']);
  });
  return { sales, installment };
}

function groupByPerson(rows, dailySales, dailyInstallment) {
  const map = {}, order = [];
  rows.forEach(row => {
    const name = row['name']; if (!name) return;
    if (!map[name]) { map[name] = { name, badge: row['badge']||'کارشناس فروش', items: [] }; order.push(name); }
    map[name].items.push({ t: row['product'], v: parseNumber(row['value']), m: parseNumber(row['max']) || 1 });
  });
  const result = order.map(n => map[n]);
  result.forEach(p => {
    p.daily = dailySales[p.name] || 0;
    p.installmentToday = dailyInstallment[p.name] || 0;
    p.photo = PHOTOS[p.name] || null;
  });
  const allP = {};
  result.forEach(p => p.items.forEach(item => {
    if (!allP[item.t]) allP[item.t] = { t: item.t, v: 0, m: 0 };
    allP[item.t].v += item.v; allP[item.t].m += item.m;
  }));
  const totalDaily = result.reduce((a, p) => a + (p.daily || 0), 0);
  const totalInstallment = result.reduce((a, p) => a + (p.installmentToday || 0), 0);
  result.push({ name: 'آمار کلی تیم', badge: 'مجموع ' + result.length + ' نفر', isTotal: true, items: Object.values(allP), daily: totalDaily, installmentToday: totalInstallment });
  return result;
}

function renderKPIs(people) {
  const team = people.find(p => p.isTotal);
  const sold = team.items.reduce((a,b)=>a+b.v,0);
  const maxT = team.items.reduce((a,b)=>a+b.m,0);
  const pct = maxT ? Math.round(sold/maxT*100) : 0;
  const cards = [
    { label: 'فروش امروز تیم', value: formatNum(team.daily), unit: 'تومان', bar: null },
    { label: 'قسط امروز تیم', value: formatNum(team.installmentToday), unit: 'تومان', bar: null },
    { label: 'پیشرفت کلی هدف', value: pct + '%', unit: '', bar: pct },
    { label: 'تعداد کارشناسان فعال', value: people.length - 1, unit: 'نفر', bar: null }
  ];
  document.getElementById('kpiRow').innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value}${c.unit ? `<span class="unit">${c.unit}</span>` : ''}</div>
      ${c.bar !== null ? `<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${c.bar}%;"></div></div>` : ''}
    </div>`).join('');
}

function renderTeamStrip(people) {
  const persons = people.filter(p => !p.isTotal).slice().sort((a,b) => b.daily - a.daily);
  const rankClass = i => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
  const html = persons.map((p, i) => `
    <div class="team-card ${i===0 ? 'leader' : ''}">
      ${i===0 ? '<div class="crown-icon">👑</div>' : ''}
      <div class="team-rank-badge ${rankClass(i)}">${i+1}</div>
      <div class="avatar-ring">
        <div class="avatar-img-wrap">
          ${p.photo ? `<img src="${p.photo}" alt="${p.name}" />` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#BF9757;">${initials(p.name)}</div>`}
        </div>
      </div>
      <div class="team-name">${p.name}</div>
      <div class="team-role">${p.badge}</div>
      <div class="team-daily">${formatNum(p.daily)}</div>
      <div class="team-daily-label">تومان فروش امروز</div>
    </div>`).join('');
  document.getElementById('teamStrip').innerHTML = html;
}

function renderChart(people) {
  const persons = people.filter(p => !p.isTotal);
  const labels = persons.map(p => p.name);
  const salesData = persons.map(p => p.daily);
  const installmentData = persons.map(p => p.installmentToday);

  if (salesChartInstance) salesChartInstance.destroy();
  const ctx = document.getElementById('salesChart');
  salesChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'فروش', data: salesData, backgroundColor: '#FCD202', borderRadius: 6, maxBarThickness: 32 },
        { label: 'قسط', data: installmentData, backgroundColor: '#7d7d7d', borderRadius: 6, maxBarThickness: 32 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + formatNum(ctx.parsed.y) + ' تومان' } }
      },
      scales: {
        x: { ticks: { color: '#bbb', font: { family: 'Vazirmatn', size: 11 } }, grid: { display: false } },
        y: { ticks: { color: '#777', font: { size: 11 }, callback: (v) => formatNum(v) }, grid: { color: '#1a1a1c' } }
      }
    }
  });
}

function renderLeaderboard(people) {
  const persons = people.filter(p => !p.isTotal).slice().sort((a,b) => b.daily - a.daily);
  const maxVal = Math.max(...persons.map(p => p.daily), 1);
  const rankClass = i => i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
  const html = persons.map((p, i) => `
    <div class="lb-row">
      <div class="lb-rank ${rankClass(i)}">${i+1}</div>
      <div class="lb-name">${p.name}</div>
      <div class="lb-bar-mini"><div class="lb-bar-mini-fill" style="width:${Math.round(p.daily/maxVal*100)}%;"></div></div>
      <div class="lb-val">${formatNum(p.daily)} تومان</div>
    </div>`).join('');
  document.getElementById('leaderboard').innerHTML = html;
}

function buildSlide(p, idx) {
  const sold = p.items.reduce((a,b) => a+b.v, 0);
  const maxT = p.items.reduce((a,b) => a+b.m, 0);
  const pct = maxT ? Math.round(sold/maxT*100) : 0;
  const rows = p.items.map(item => {
    const ip = item.m ? Math.min(Math.round(item.v/item.m*100),100) : 0;
    return `<div class="ri"><div class="rl">${item.t}</div><div class="bo"><div class="bi" style="width:${ip}%;"></div><div class="bm">${item.v} / ${item.m}</div></div></div>`;
  }).join('');
  const avatarHtml = p.isTotal
    ? `<div class="slide-avatar no-img">👥</div>`
    : (p.photo ? `<div class="slide-avatar"><img src="${p.photo}" alt="${p.name}" /></div>` : `<div class="slide-avatar no-img">${initials(p.name)}</div>`);
  return `<div class="slide${idx===0?' active':''}" id="slide${idx}">
    <div class="slide-header">
      <div class="slide-person">
        ${avatarHtml}
        <div><div class="slide-name">${p.name}</div><div class="slide-sub">${p.badge}</div></div>
      </div>
      <div class="badge ${p.isTotal?'badge-total':'badge-gold'}">${p.isTotal?'گزارش مدیریتی':'گزارش فروش'}</div>
    </div>
    <div class="progress-overall">
      <span class="label">پیشرفت کلی هدف</span>
      <div class="track"><div class="fillp" style="width:${pct}%;"></div></div>
      <span class="pct">${pct}%</span>
    </div>
    <div class="rows">${rows}</div>
  </div>`;
}
function renderSlides() {
  document.getElementById('slidesWrap').innerHTML = people.map((p,i) => buildSlide(p,i)).join('');
  document.getElementById('navDots').innerHTML = people.map((_,i) => `<div class="dot${i===0?' active':''}" data-i="${i}"></div>`).join('');
  document.querySelectorAll('.dot').forEach(d => { d.onclick = () => { stopPlay(); goTo(+d.dataset.i); if(playing) startPlay(); }; });
}
function goTo(n) {
  document.querySelectorAll('.slide')[cur]?.classList.remove('active');
  document.querySelectorAll('.dot')[cur]?.classList.remove('active');
  cur = (n + people.length) % people.length;
  document.querySelectorAll('.slide')[cur]?.classList.add('active');
  document.querySelectorAll('.dot')[cur]?.classList.add('active');
  resetFill();
}
function next() { goTo(cur+1); }
function resetFill() {
  fill.style.transition = 'none'; fill.style.width = '0%';
  setTimeout(() => { fill.style.transition = `width ${SLIDE_INTERVAL}ms linear`; fill.style.width = '100%'; }, 30);
}
function startPlay() { clearInterval(timer); timer = setInterval(next, SLIDE_INTERVAL); resetFill(); }
function stopPlay() { clearInterval(timer); fill.style.transition = 'none'; fill.style.width = '0%'; }

function updateClock() {
  const now = new Date();
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('clockDate').textContent = now.toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
setInterval(updateClock, 1000);
updateClock();

async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('خطا در دریافت');
    const text = await res.text();
    const rows = parseCSV(text);
    const { sales, installment } = getDailyMap(rows);
    const prevCur = cur;
    people = groupByPerson(rows, sales, installment);
    cur = Math.min(prevCur, people.length - 1);
    renderKPIs(people);
    renderTeamStrip(people);
    renderChart(people);
    renderLeaderboard(people);
    renderSlides();
    document.querySelectorAll('.slide')[cur]?.classList.add('active');
    document.querySelectorAll('.dot')[cur]?.classList.add('active');
    if (playing) startPlay();
  } catch (e) {
    document.getElementById('slidesWrap').innerHTML = `<div class="err">خطا در دریافت اطلاعات از Google Sheets<br><small>${e.message}</small></div>`;
  }
}

loadData();
setInterval(loadData, AUTO_REFRESH_MS);
</script>
</body>
</html>
