<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گزارش فعالیت تیم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    direction: rtl;
    background: #f4f4f4;
    padding: 2rem 1.5rem;
  }
  h2 { text-align: center; margin-bottom: 6px; font-size: 26px; font-weight: 700; color: #222; }
  .subtitle { text-align: center; margin-bottom: 30px; font-size: 14px; color: #777; }
  #chart-wrapper { max-width: 1500px; margin: auto; }
  .row { display: flex; align-items: center; margin: 20px 0; }
  .total { width: 80px; text-align: center; font-size: 22px; font-weight: 700; color: #222; flex-shrink: 0; }
  .right { display: flex; align-items: center; flex: 1; }
  .name { width: 190px; font-size: 18px; font-weight: 500; text-align: right; margin-left: 15px; flex-shrink: 0; }
  .bar { flex: 1; height: 46px; background: #e8e8e8; border-radius: 8px; overflow: hidden; }
  .inner-bar { height: 100%; display: flex; }
  .seg { display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; transition: width .6s ease; }
  .green { background: #4caf50; }
  .pink { background: #f06292; }
  .purple { background: #9c27b0; }
  .pink-magenta { background: #ec407a; }
  .phosphor-green { background: #00c853; }
  .teal { background: #009688; }
  .blue-light { background: #42a5f5; }
  .black-matte { background: #333; }
  .legend { margin: 36px auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; font-size: 14px; color: #333; max-width: 1500px; }
  .legend span { display: flex; align-items: center; }
  .legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-left: 6px; }
  .refresh-info { text-align: center; font-size: 12px; color: #999; margin-top: 24px; }
  .loading, .err { text-align: center; padding: 3rem; color: #888; font-size: 16px; }
  .err { color: #c0392b; }
</style>
</head>
<body>

<h2>گزارش فعالیت تیم</h2>
<div class="subtitle" id="subtitle">در حال بارگذاری...</div>

<div id="chart-wrapper"><div class="loading">در حال دریافت اطلاعات از Google Sheets...</div></div>

<div class="legend">
  <span><i class="black-matte"></i>تماس خروجی</span>
  <span><i class="blue-light"></i>تماس ورودی</span>
  <span><i class="green"></i>پرزنت عمیق</span>
  <span><i class="pink"></i>ارسال پیغام</span>
  <span><i class="purple"></i>پیگیری در آینده</span>
  <span><i class="pink-magenta"></i>تکمیل مشخصات فردی و کاری</span>
  <span><i class="phosphor-green"></i>پیگیری ویژه</span>
  <span><i class="teal"></i>لیدهای ساجست</span>
</div>

<div class="refresh-info" id="refreshInfo"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREbVqCizGPAJxn42P6HMEOWXwC8M7YZulA33gH9MplFbhbHxWn6UIxzxIn765HwvPhLBVJ-L6GO2Gb/pub?output=csv";
const AUTO_REFRESH_MS = 10 * 1000;

const COLUMN_MAP = {
  "تماس خروجی": "black-matte",
  "تماس ورودی": "blue-light",
  "پرزنت عمیق": "green",
  "ارسال پیغام": "pink",
  "پیگیری در آینده": "purple",
  "تکمیل مشخصات فردی و کاری": "pink-magenta",
  "پیگیری ویژه": "phosphor-green",
  "لیدهای ساجست": "teal"
};
const COLUMN_ORDER = Object.keys(COLUMN_MAP);

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const fullText = text.replace(/\r/g, '');
  let i = 0;
  while (i < fullText.length) {
    const c = fullText[i];
    if (inQuotes) {
      if (c === '"') {
        if (fullText[i+1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++; continue;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function parseNumber(str) {
  if (!str) return 0;
  const cleaned = String(str).replace(/[,\s]/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function findActivityTable(allRows) {
  for (let i = 0; i < allRows.length; i++) {
    const row = allRows[i].map(c => c.trim());
    if (row.includes('کاربر') && row.some(c => COLUMN_ORDER.includes(c))) {
      return { headerIndex: i, headers: row };
    }
  }
  return null;
}

function buildUsers(allRows) {
  const table = findActivityTable(allRows);
  if (!table) return [];
  const { headerIndex, headers } = table;
  const userCol = headers.indexOf('کاربر');

  const colIndicesByLabel = {};
  COLUMN_ORDER.forEach(label => {
    colIndicesByLabel[label] = [];
    headers.forEach((h, idx) => { if (h === label) colIndicesByLabel[label].push(idx); });
  });

  const users = [];
  for (let i = headerIndex + 1; i < allRows.length; i++) {
    const row = allRows[i];
    const name = (row[userCol] || '').trim();
    if (!name) break;
    const user = { name, total: 0 };
    COLUMN_ORDER.forEach(label => {
      const val = colIndicesByLabel[label].reduce((sum, colIdx) => sum + parseNumber(row[colIdx]), 0);
      user[COLUMN_MAP[label]] = val;
      user.total += val;
    });
    users.push(user);
  }
  return users.sort((a, b) => b.total - a.total);
}

function renderChart(users) {
  const wrapper = document.getElementById('chart-wrapper');
  if (!users.length) {
    wrapper.innerHTML = '<div class="err">جدول گزارش فعالیت در شیت پیدا نشد</div>';
    return;
  }
  const maxValue = Math.max(...users.map(u => u.total), 1);
  wrapper.innerHTML = '';
  users.forEach(user => {
    const row = document.createElement('div');
    row.className = 'row';

    const totalBox = document.createElement('div');
    totalBox.className = 'total';
    totalBox.innerText = user.total;

    const right = document.createElement('div');
    right.className = 'right';

    const name = document.createElement('div');
    name.className = 'name';
    name.innerText = user.name;

    const bar = document.createElement('div');
    bar.className = 'bar';

    const innerBar = document.createElement('div');
    innerBar.className = 'inner-bar';
    innerBar.style.width = (user.total / maxValue * 100) + '%';

    Object.values(COLUMN_MAP).forEach(c => {
      const v = user[c] || 0;
      if (v) {
        const seg = document.createElement('div');
        seg.className = 'seg ' + c;
        seg.style.width = (v / user.total * 100) + '%';
        seg.innerText = v;
        innerBar.appendChild(seg);
      }
    });

    bar.appendChild(innerBar);
    right.appendChild(name);
    right.appendChild(bar);
    row.appendChild(totalBox);
    row.appendChild(right);
    wrapper.appendChild(row);
  });
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('خطا در دریافت');
    const text = await res.text();
    const allRows = parseCSV(text);
    const users = buildUsers(allRows);
    renderChart(users);
    const now = new Date();
    document.getElementById('subtitle').textContent = 'بروزرسانی زنده — ' + now.toLocaleDateString('fa-IR');
    document.getElementById('refreshInfo').textContent = 'آخرین بروزرسانی: ' + now.toLocaleTimeString('fa-IR');
  } catch (e) {
    document.getElementById('chart-wrapper').innerHTML = '<div class="err">خطا در دریافت اطلاعات از Google Sheets<br><small>' + e.message + '</small></div>';
  }
}

loadData();
setInterval(loadData, AUTO_REFRESH_MS);
</script>
</body>
</html>
